<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Taxi payment data pipeline</title>
  <desc id="desc">Airflow waits for a Parquet file in S3, starts a PySpark job and writes an aggregate data mart to ClickHouse.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#93c5fd"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <text x="64" y="62" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Daily taxi payment data mart</text>
  <text x="64" y="92" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Orchestration, distributed processing and analytical storage</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="64" y="132" width="220" height="142" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="88" y="174" fill="#93c5fd" font-size="15" font-weight="700">SOURCE</text>
    <text x="88" y="211" fill="#f8fafc" font-size="24" font-weight="700">S3 + Parquet</text>
    <text x="88" y="240" fill="#cbd5e1" font-size="15">Daily trip records</text>

    <rect x="365" y="132" width="220" height="142" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="389" y="174" fill="#c4b5fd" font-size="15" font-weight="700">ORCHESTRATION</text>
    <text x="389" y="211" fill="#f8fafc" font-size="24" font-weight="700">Apache Airflow</text>
    <text x="389" y="240" fill="#cbd5e1" font-size="15">Sensor + daily DAG</text>

    <rect x="666" y="132" width="220" height="142" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="690" y="174" fill="#6ee7b7" font-size="15" font-weight="700">PROCESSING</text>
    <text x="690" y="211" fill="#f8fafc" font-size="24" font-weight="700">PySpark</text>
    <text x="690" y="240" fill="#cbd5e1" font-size="15">Payment aggregates</text>

    <rect x="967" y="132" width="169" height="142" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="991" y="174" fill="#fbbf24" font-size="15" font-weight="700">MART</text>
    <text x="991" y="211" fill="#f8fafc" font-size="23" font-weight="700">ClickHouse</text>
    <text x="991" y="240" fill="#cbd5e1" font-size="15">JDBC output</text>
  </g>

  <path d="M284 203 H350" stroke="#93c5fd" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M585 203 H651" stroke="#93c5fd" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M886 203 H952" stroke="#93c5fd" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <text x="600" y="323" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">trip count • average fare • average tips • total revenue</text>
</svg>
